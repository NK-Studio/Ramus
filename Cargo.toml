[workspace]
resolver = "3"
members = ["crates/gitvcs-core", "crates/gitvcs-app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["NK Studio"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
