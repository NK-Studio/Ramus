# main 에 올라오는 커밋과 PR 은 테스트·빌드만 하고,
# v* 태그를 푸시하면 macOS(Apple Silicon)·Windows 빌드를 GitHub 릴리즈에 올린다.
name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # 앱이 새 판을 확인하는 매니페스트 주소(예: https://ramus.pages.dev/manifest.json). 비어 있으면 앱은 업데이트를 확인하지 않는다.
  # 빌드에 묻히고(crates/ramus-app/src/updater.rs), 릴리스 작업이 이 주소의 사이트에 manifest.json 을 올린다.
  RAMUS_UPDATE_URL: ${{ vars.RAMUS_UPDATE_URL }}

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: cargo test --workspace
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tests/ui/syntax.test.mjs
      - run: node tests/ui/repocache.test.mjs
      - run: node tests/ui/hidden.test.mjs
      - run: node tests/ui/changelog.test.mjs
      - run: node tests/ui/i18n.test.mjs
      - run: node tests/ui/update-manifest.test.mjs

  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-15 # arm64 러너
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build Ramus.app
        run: sh scripts/bundle-macos.sh release
      - name: Check architecture
        run: |
          lipo -archs target/release/Ramus.app/Contents/MacOS/ramus
          target/release/Ramus.app/Contents/Resources/git/bin/git --version
      # 태그 빌드와 수동 실행에서만 Developer ID 로 서명하고 공증한다(PR·main 빌드는 시크릿 없이 임시 서명 그대로).
      - name: Import signing certificate
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Sign Ramus.app
        if: env.MACOS_KEYCHAIN != ''
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$MACOS_KEYCHAIN" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          test -n "$IDENTITY" || { echo "::error::Developer ID Application 인증서를 찾지 못했습니다"; exit 1; }
          # 내장 git 안의 실행 파일·라이브러리(Mach-O)를 먼저 하나씩 서명해야 공증을 통과한다.
          find target/release/Ramus.app/Contents/Resources/git -type f | while read -r f; do
            if file -b "$f" | grep -q "Mach-O"; then
              if [ "$(basename "$f")" = "git-credential-manager" ]; then
                codesign --force --options runtime --timestamp --entitlements assets/git/gcm-entitlements.plist --sign "$IDENTITY" "$f"
              else
                codesign --force --options runtime --timestamp --sign "$IDENTITY" "$f"
              fi
            fi
          done
          codesign --force --options runtime --timestamp --sign "$IDENTITY" target/release/Ramus.app
          codesign --verify --strict --verbose=2 target/release/Ramus.app
      - name: Notarize Ramus.app
        if: env.MACOS_KEYCHAIN != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent target/release/Ramus.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple target/release/Ramus.app
          spctl -a -vv -t exec target/release/Ramus.app
      # 끌어다 놓아 설치하는 DMG(왼쪽 Ramus → 오른쪽 Applications). 서명 빌드에서는 DMG 도 서명·공증한다.
      - name: Package DMG
        run: |
          mkdir -p dist
          sh scripts/make-dmg.sh target/release/Ramus.app "dist/Ramus-${{ github.ref_name }}-macos-arm64.dmg"
      - name: Sign & notarize DMG
        if: env.MACOS_KEYCHAIN != ''
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG="dist/Ramus-${{ github.ref_name }}-macos-arm64.dmg"
          IDENTITY=$(security find-identity -v -p codesigning "$MACOS_KEYCHAIN" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
      - name: Remove signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/*

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    # Windows 빌드는 서명하지 않는다(처음 실행할 때 SmartScreen 경고가 뜰 수 있다).
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build ramus.exe
        run: cargo build --release -p ramus-app --target x86_64-pc-windows-msvc
      - name: Fetch bundled git
        shell: bash
        run: sh scripts/fetch-git.sh windows-x64
      # zip(압축만 풀어 쓰는 판)과 설치 파일에 같은 폴더(Ramus.exe · git · README.md)를 넣는다.
      - name: Package zip
        shell: pwsh
        run: |
          # PR 빌드의 ref_name(123/merge)에는 / 가 있어 파일 이름에 쓸 수 없다.
          $name = "Ramus-$('${{ github.ref_name }}' -replace '[\\/]', '-')-windows-x64"
          $stage = "target/stage/$name"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/ramus.exe "$stage/Ramus.exe"
          Copy-Item -Recurse vendor/git/windows-x64 "$stage/git"
          Remove-Item -Force "$stage/git/.ramus-git"
          $git = "$stage/git/cmd/git.exe"
          & $git --version
          # Git for Windows 처럼 자격 증명은 GCM(Windows 자격 증명 관리자)에 둔다 — 앱 GitHub 로그인도 여기에 들어간다.
          $helper = & $git config --system --get credential.helper
          if (-not $helper) { & $git config --system credential.helper manager }
          & $git config --system --show-origin --get credential.helper
          Copy-Item README.md "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip"
          Add-Content $env:GITHUB_ENV "WIN_NAME=$name"
          Add-Content $env:GITHUB_ENV "WIN_STAGE=$((Resolve-Path $stage).Path)"
      # 설치 마법사(scripts/windows-installer.iss). 앱 버전은 Cargo.toml 의 workspace 버전을 쓴다.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path target/installer | Out-Null
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$env:WIN_STAGE" "/DOutputDir=$((Resolve-Path target/installer).Path)" "/DOutputName=$env:WIN_NAME-setup" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "설치 파일을 만들지 못했습니다(ISCC $LASTEXITCODE)" }
          Get-ChildItem target/installer
      - name: Collect installer
        shell: pwsh
        run: |
          Copy-Item "target/installer/$env:WIN_NAME-setup.exe" dist/
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "{macos-arm64,windows-x64}"
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## 내려받기

            | OS | 파일 |
            | --- | --- |
            | macOS (Apple Silicon, macOS 12 이상) | `Ramus-${{ github.ref_name }}-macos-arm64.dmg` |
            | Windows 10/11 (x64) 설치 | `Ramus-${{ github.ref_name }}-windows-x64-setup.exe` |
            | Windows 10/11 (x64) 압축(설치 없이) | `Ramus-${{ github.ref_name }}-windows-x64.zip` |

            git 이 앱에 들어 있어(git-lfs 포함) 따로 설치하지 않아도 됩니다. 설정 > git 에서 시스템 git 이나 직접 고른 git 으로 바꿀 수 있습니다.
            Windows 는 WebView2 런타임(Windows 10/11 기본 포함)을 씁니다. Windows 압축 파일은 `Ramus.exe` 와 `git` 폴더를 같은 자리에 함께 풀어 두세요.

            ### Windows 설치
            `setup.exe` 를 실행하면 설치 마법사가 열립니다. 첫 화면에서 **나만 설치**(관리자 권한 없이 `%LOCALAPPDATA%\Programs\Ramus`) 와 **모든 사용자**(`Program Files`) 중에 고릅니다. 새 판의 설치 파일을 실행하면 그대로 업그레이드되고, 제거는 Windows 설정 > 앱에서 합니다.

            ### macOS 처음 실행
            Apple Developer ID 로 서명·공증된 앱입니다. DMG 를 열고 창 안의 `Ramus` 를 옆의 `Applications` 폴더로 끌어다 놓으면 설치됩니다.

            ### Windows 처음 실행
            SmartScreen 경고가 뜨면 **추가 정보 → 실행** 을 누르세요.

  # 앱 업데이트: 매니페스트(최신 + 아래 두 판)를 site/manifest.json 으로 만들어 main 에 커밋한다. Cloudflare Workers Builds 가
  # 이 저장소(GitHub 연결)의 main 을 보고 있다가 site/ 를 배포한다(wrangler.jsonc). 그 뒤 매니페스트에서 빠진 옛 GitHub 릴리스를
  # 지운다(태그는 남긴다). 저장소 변수 RAMUS_UPDATE_URL 이 있을 때만 돈다.
  update-site:
    name: Publish update manifest
    if: startsWith(github.ref, 'refs/tags/v') && vars.RAMUS_UPDATE_URL != ''
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write # 매니페스트 커밋·옛 릴리스 지우기
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "{macos-arm64,windows-x64}"
          merge-multiple: true
      - name: Build manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREV="$RUNNER_TEMP/previous.json"
          # 변경 기록은 태그 시점의 ChangeLog.md 에서 뽑는다(main 이 그 뒤로 더 나갔을 수 있다).
          git fetch --depth=1 origin "refs/tags/$GITHUB_REF_NAME"
          git show "FETCH_HEAD:ChangeLog.md" > "$RUNNER_TEMP/ChangeLog.md"
          notes() { awk -v v="$1" '/^## \[/ { if (on) exit; on = index($0, "## [" v "]") == 1; next } on { print }' "$RUNNER_TEMP/ChangeLog.md" | sed '/./,$!d'; }
          notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          # 저장소에 있는 매니페스트에서 이전 판들을 이어 받는다.
          if [ -f site/manifest.json ]; then cp site/manifest.json "$PREV"; else echo '{}' > "$PREV"; fi
          # 처음 올릴 때는 매니페스트가 없다 — 직전 두 릴리스의 설치 파일을 받아 해시를 재고 먼저 넣는다(안 그러면 아래 단계가 그 릴리스들을 지운다).
          if ! node -e "const m=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.exit((m.releases||[]).length?0:1)" "$PREV"; then
            for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | grep '^v' | grep -vx "$GITHUB_REF_NAME" | sort -V -r | head -2 | sort -V); do
              old="$RUNNER_TEMP/old/$tag"
              mkdir -p "$old"
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" -D "$old" -p '*-macos-arm64.dmg' -p '*-windows-x64-setup.exe' -p '*-windows-x64.zip' || continue
              notes "${tag#v}" > "$old.md"
              date=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt[0:10]')
              node scripts/update-manifest.mjs --version "${tag#v}" --date "$date" --repo "$GITHUB_REPOSITORY" --dist "$old" --notes "$old.md" --previous "$PREV" --keep 3 --out "$RUNNER_TEMP/seed/manifest.json" || continue
              cp "$RUNNER_TEMP/seed/manifest.json" "$PREV"
            done
          fi
          node scripts/update-manifest.mjs \
            --version "$VERSION" --repo "$GITHUB_REPOSITORY" --dist dist \
            --notes "$RUNNER_TEMP/notes.md" --previous "$PREV" \
            --page "${RAMUS_UPDATE_URL%manifest.json}" --keep 3 \
            --out "$RUNNER_TEMP/manifest/manifest.json"
          cp "$RUNNER_TEMP/manifest/manifest.json" site/manifest.json
          cat site/manifest.json
      # 이 커밋을 Cloudflare 가 받아 배포한다. GITHUB_TOKEN 으로 푸시한 커밋은 워크플로를 다시 돌리지 않는다.
      - name: Commit manifest to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/manifest.json
          git diff --cached --quiet && { echo "바뀐 것 없음"; exit 0; }
          git commit -m "Publish update manifest for $GITHUB_REF_NAME"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
      # 매니페스트에 남은 판(최신 + 아래 두 판)의 릴리스만 둔다. git 태그는 지우지 않는다.
      - name: Remove older GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP="$RUNNER_TEMP/manifest/keep.txt"
          cat "$KEEP"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            case "$tag" in v*) ;; *) continue ;; esac
            if ! grep -qx "$tag" "$KEEP"; then
              echo "지움: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
