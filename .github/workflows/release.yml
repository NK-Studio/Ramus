# main 에 올라오는 커밋과 PR 은 테스트·빌드만 하고,
# v* 태그를 푸시하면 macOS(Apple Silicon)·Windows 빌드를 GitHub 릴리즈에 올린다.
name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: cargo test --workspace
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tests/ui/syntax.test.mjs
      - run: node tests/ui/repocache.test.mjs
      - run: node tests/ui/hidden.test.mjs
      - run: node tests/ui/changelog.test.mjs
      - run: node tests/ui/i18n.test.mjs

  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-15 # arm64 러너
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build Ramus.app
        run: sh scripts/bundle-macos.sh release
      - name: Check architecture
        run: |
          lipo -archs target/release/Ramus.app/Contents/MacOS/ramus
          target/release/Ramus.app/Contents/Resources/git/bin/git --version
      # 태그 빌드와 수동 실행에서만 Developer ID 로 서명하고 공증한다(PR·main 빌드는 시크릿 없이 임시 서명 그대로).
      - name: Import signing certificate
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Sign Ramus.app
        if: env.MACOS_KEYCHAIN != ''
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$MACOS_KEYCHAIN" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          test -n "$IDENTITY" || { echo "::error::Developer ID Application 인증서를 찾지 못했습니다"; exit 1; }
          # 내장 git 안의 실행 파일·라이브러리(Mach-O)를 먼저 하나씩 서명해야 공증을 통과한다.
          find target/release/Ramus.app/Contents/Resources/git -type f | while read -r f; do
            if file -b "$f" | grep -q "Mach-O"; then
              if [ "$(basename "$f")" = "git-credential-manager" ]; then
                codesign --force --options runtime --timestamp --entitlements assets/git/gcm-entitlements.plist --sign "$IDENTITY" "$f"
              else
                codesign --force --options runtime --timestamp --sign "$IDENTITY" "$f"
              fi
            fi
          done
          codesign --force --options runtime --timestamp --sign "$IDENTITY" target/release/Ramus.app
          codesign --verify --strict --verbose=2 target/release/Ramus.app
      - name: Notarize Ramus.app
        if: env.MACOS_KEYCHAIN != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent target/release/Ramus.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple target/release/Ramus.app
          spctl -a -vv -t exec target/release/Ramus.app
      # 끌어다 놓아 설치하는 DMG(왼쪽 Ramus → 오른쪽 Applications). 서명 빌드에서는 DMG 도 서명·공증한다.
      - name: Package DMG
        run: |
          mkdir -p dist
          sh scripts/make-dmg.sh target/release/Ramus.app "dist/Ramus-${{ github.ref_name }}-macos-arm64.dmg"
      - name: Sign & notarize DMG
        if: env.MACOS_KEYCHAIN != ''
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG="dist/Ramus-${{ github.ref_name }}-macos-arm64.dmg"
          IDENTITY=$(security find-identity -v -p codesigning "$MACOS_KEYCHAIN" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
      - name: Remove signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/*

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read # SignPath 가 이 실행의 정보를 읽고 서명할 artifact 를 받아 간다
    env:
      # 태그 빌드와 수동 실행에서, 저장소 변수에 SignPath 설정이 있을 때만 서명한다(PR·main 빌드와 설정 전에는 서명 없이 그대로).
      SIGN_WINDOWS: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build ramus.exe
        run: cargo build --release -p ramus-app --target x86_64-pc-windows-msvc
      # SignPath 는 GitHub artifact 로 올린 파일만 받아 서명한다. 서명 전 파일은 릴리즈에 섞이지 않게 이름을 달리하고 하루만 둔다.
      - name: Upload unsigned ramus.exe
        id: unsigned
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-x64
          path: target/x86_64-pc-windows-msvc/release/ramus.exe
          retention-days: 1
      # release-signing 정책은 SignPath 에서 승인자가 승인해야 끝나므로 승인을 기다릴 시간을 넉넉히 둔다.
      # SignPath 프로젝트에는 artifact configuration 두 개를 둔다: exe(ramus.exe) 와 installer(설치 파일).
      - name: Sign ramus.exe (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/signed
      - name: Check signature
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature target/signed/ramus.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($sig.Status -ne 'Valid') { throw "ramus.exe 서명이 올바르지 않습니다: $($sig.Status)" }
      - name: Fetch bundled git
        shell: bash
        run: sh scripts/fetch-git.sh windows-x64
      # zip(압축만 풀어 쓰는 판)과 설치 파일에 같은 폴더(Ramus.exe · git · README.md)를 넣는다.
      - name: Package zip
        shell: pwsh
        run: |
          # PR 빌드의 ref_name(123/merge)에는 / 가 있어 파일 이름에 쓸 수 없다.
          $name = "Ramus-$('${{ github.ref_name }}' -replace '[\\/]', '-')-windows-x64"
          $stage = "target/stage/$name"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          $exe = if ($env:SIGN_WINDOWS -eq 'true') { "target/signed/ramus.exe" } else { "target/x86_64-pc-windows-msvc/release/ramus.exe" }
          Copy-Item $exe "$stage/Ramus.exe"
          Copy-Item -Recurse vendor/git/windows-x64 "$stage/git"
          Remove-Item -Force "$stage/git/.ramus-git"
          $git = "$stage/git/cmd/git.exe"
          & $git --version
          # Git for Windows 처럼 자격 증명은 GCM(Windows 자격 증명 관리자)에 둔다 — 앱 GitHub 로그인도 여기에 들어간다.
          $helper = & $git config --system --get credential.helper
          if (-not $helper) { & $git config --system credential.helper manager }
          & $git config --system --show-origin --get credential.helper
          Copy-Item README.md "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip"
          Add-Content $env:GITHUB_ENV "WIN_NAME=$name"
          Add-Content $env:GITHUB_ENV "WIN_STAGE=$((Resolve-Path $stage).Path)"
      # 설치 마법사(scripts/windows-installer.iss). 앱 버전은 Cargo.toml 의 workspace 버전을 쓴다.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path target/installer | Out-Null
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$env:WIN_STAGE" "/DOutputDir=$((Resolve-Path target/installer).Path)" "/DOutputName=$env:WIN_NAME-setup" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "설치 파일을 만들지 못했습니다(ISCC $LASTEXITCODE)" }
          Get-ChildItem target/installer
      # 설치 파일은 이미 서명된 Ramus.exe 를 담은 채로 한 번 더 서명한다.
      - name: Upload unsigned installer
        id: unsigned-setup
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-x64-setup
          path: target/installer/*.exe
          retention-days: 1
      - name: Sign installer (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/signed-setup
      - name: Collect installer
        shell: pwsh
        run: |
          $setup = "$env:WIN_NAME-setup.exe"
          if ($env:SIGN_WINDOWS -eq 'true') {
            $sig = Get-AuthenticodeSignature "target/signed-setup/$setup"
            $sig | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
            if ($sig.Status -ne 'Valid') { throw "설치 파일 서명이 올바르지 않습니다: $($sig.Status)" }
            Copy-Item "target/signed-setup/$setup" dist/
          } else {
            Copy-Item "target/installer/$setup" dist/
          }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "{macos-arm64,windows-x64}" # 서명 전 unsigned-* 는 올리지 않는다
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## 내려받기

            | OS | 파일 |
            | --- | --- |
            | macOS (Apple Silicon, macOS 12 이상) | `Ramus-${{ github.ref_name }}-macos-arm64.dmg` |
            | Windows 10/11 (x64) 설치 | `Ramus-${{ github.ref_name }}-windows-x64-setup.exe` |
            | Windows 10/11 (x64) 압축(설치 없이) | `Ramus-${{ github.ref_name }}-windows-x64.zip` |

            git 이 앱에 들어 있어(git-lfs 포함) 따로 설치하지 않아도 됩니다. 설정 > git 에서 시스템 git 이나 직접 고른 git 으로 바꿀 수 있습니다.
            Windows 는 WebView2 런타임(Windows 10/11 기본 포함)을 씁니다. Windows 압축 파일은 `Ramus.exe` 와 `git` 폴더를 같은 자리에 함께 풀어 두세요.

            ### Windows 설치
            `setup.exe` 를 실행하면 설치 마법사가 열립니다. 첫 화면에서 **나만 설치**(관리자 권한 없이 `%LOCALAPPDATA%\Programs\Ramus`) 와 **모든 사용자**(`Program Files`) 중에 고릅니다. 새 판의 설치 파일을 실행하면 그대로 업그레이드되고, 제거는 Windows 설정 > 앱에서 합니다.

            ### macOS 처음 실행
            Apple Developer ID 로 서명·공증된 앱입니다. DMG 를 열고 창 안의 `Ramus` 를 옆의 `Applications` 폴더로 끌어다 놓으면 설치됩니다.

            ### Windows 처음 실행
            SmartScreen 경고가 뜨면 **추가 정보 → 실행** 을 누르세요.
